x-common-variables: &common-variables
  PYTHONUNBUFFERED: "yes"
  DISPATCHER_ENDPOINT: http://dispatcher:8111
  PLUGIN_EVENTS_URL: http://dispatcher:8111
  PLUGIN_DATA_URL: http://dispatcher:8111
  PLUGIN_MAX_FILE_SIZE: "100000000" # default limit of 100mb

services:
  unbox:
    image: docker.io/asdazul/plugin-unbox:13.0.0@sha256:3419bd5073a4859d43acd2556d38243a5bc75826fa904c92eb4aa36d856c3f46
    environment:
      <<: *common-variables
    networks:
      - azul

  entropy:
    image: docker.io/asdazul/plugin-entropy:13.0.0@sha256:b870f3f507e595c5db156599d3be7215b555bbba4b5d928a76f3701683d6e92d
    environment:
      <<: *common-variables
      DISPATCHER_ENDPOINT: http://dispatcher:8111
    networks:
      - azul

  yara:
    image: docker.io/asdazul/plugin-yara:13.0.0@sha256:1e14924dc04117d086fd29e0c827e48767c7b59eeaef2a449195ec4029358239
    environment:
      <<: *common-variables
      PLUGIN_NAME_SUFFIX: demo
      PLUGIN_SECURITY_OVERRIDE: OFFICIAL TLP:AMBER+STRICT
      PLUGIN_YARA_RULES_PATH: /yara_rules
      PLUGIN_MAX_FILE_SIZE: "10485760"
      PLUGIN_VERSION_SUFFIX: "9.0.0"
    volumes:
      - ./yara_rules:/yara_rules
    networks:
      - azul

networks:
  azul:
    name: azul_net
    external: true
