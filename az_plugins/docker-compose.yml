x-common-variables: &common-variables
  PYTHONUNBUFFERED: "yes"
  DISPATCHER_ENDPOINT: http://dispatcher:8111
  PLUGIN_EVENTS_URL: http://dispatcher:8111
  PLUGIN_DATA_URL: http://dispatcher:8111
  PLUGIN_MAX_FILE_SIZE: "100000000" # default limit of 100mb

services:
  unbox:
    image: docker.io/asdazul/plugin-unbox:13.0.0@sha256:3419bd5073a4859d43acd2556d38243a5bc75826fa904c92eb4aa36d856c3f46
    environment:
      <<: *common-variables
    networks:
      - azul

  malcarve:
    image: docker.io/asdazul/plugin-malcarve:13.0.0@sha256:155562620d0bc165abf95c9e01e481048b04e1b6a038584c40d8854a9ce9c026
    environment:
      <<: *common-variables
    networks:
      - azul

  entropy:
    image: docker.io/asdazul/plugin-entropy:13.0.0@sha256:b870f3f507e595c5db156599d3be7215b555bbba4b5d928a76f3701683d6e92d
    environment:
      <<: *common-variables
      DISPATCHER_ENDPOINT: http://dispatcher:8111
    networks:
      - azul

  mandiant-capa:
    image: docker.io/asdazul/plugin-mandiant-capa:13.0.0@sha256:8baaf1643d408d3956198fa5d81c302fd1a391e35218fa2ff33988bc40207e03
    environment:
      <<: *common-variables
    networks:
      - azul

  tika:
    image: docker.io/asdazul/plugin-tika:13.0.0@sha256:c75c3910d70e2fb1ac239edbfbe7b0a1e1f431e97b9750f158a8a3079cbacef4
    environment:
      <<: *common-variables
    networks:
      - azul
    command:
      - "--config"
      - "tika_server"
      - "http://apache-tika:9998"

  apache-tika:
    image: docker.io/apache/tika:3.3.3.0-full@sha256:6ef30abd65df4b6c478907904099d0245bdb0e0686f94fb9bc7493558442bb74
    environment:
      <<: *common-variables
    networks:
      - azul

  yara:
    image: docker.io/asdazul/plugin-yara:13.0.0@sha256:1e14924dc04117d086fd29e0c827e48767c7b59eeaef2a449195ec4029358239
    environment:
      <<: *common-variables
      PLUGIN_NAME_SUFFIX: demo
      PLUGIN_SECURITY_OVERRIDE: OFFICIAL TLP:AMBER+STRICT
      PLUGIN_YARA_RULES_PATH: /yara_rules
      PLUGIN_MAX_FILE_SIZE: "10485760"
      PLUGIN_VERSION_SUFFIX: "9.0.0"
    volumes:
      - ./yara_rules:/yara_rules
    networks:
      - azul

networks:
  azul:
    name: azul_net
    external: true
